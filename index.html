<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BNBM NAKLADNOY</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e9f0;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header span {
            color: #667085;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 73px);
        }

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e5e9f0;
            padding: 20px 14px;
        }

        .menu {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 14px;
            margin-bottom: 6px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .menu:hover,
        .menu.active {
            background: #e8f1ff;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .page-title h2 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .page-title p {
            color: #667085;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #e5e9f0;
        }

        .card-title {
            color: #667085;
            font-size: 14px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .panel {
            background: white;
            border: 1px solid #e5e9f0;
            border-radius: 14px;
            padding: 25px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #eef5ff;
        }

        .error {
            background: #fff0f0;
            color: #b42318;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
            }

            .content {
                padding: 18px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>BNBM NAKLADNOY</h1>
    <span>Yuk xatlarini boshqarish tizimi</span>
</header>

<div class="layout">

    <aside class="sidebar">

        <button class="menu active" onclick="showPage('home', this)">
            🏠 Bosh sahifa
        </button>

        <button class="menu" onclick="showPage('shipments', this)">
            🧾 Yangi nakladnoy
        </button>

        <button class="menu" onclick="showPage('warehouse', this)">
            🏭 Bugungi ombor
        </button>

        <button class="menu" onclick="showPage('customers', this)">
            🏢 Buyurtmachilar
        </button>

        <button class="menu" onclick="showPage('products', this)">
            📦 Mahsulotlar
        </button>

        <button class="menu" onclick="showPage('vehicles', this)">
            🚛 Mashinalar
        </button>

        <button class="menu" onclick="showPage('history', this)">
            📚 Nakladnoy tarixi
        </button>

    </aside>

    <main class="content">

        <div class="page-title">
            <h2 id="pageTitle">Bosh sahifa</h2>
            <p id="pageDescription">
                BNBM nakladnoy boshqaruv tizimi
            </p>
        </div>

        <div id="pageContent">

            <div class="cards">

                <div class="card">
                    <div class="card-title">Buyurtmachilar</div>
                    <div class="card-value" id="customerCount">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Mahsulotlar</div>
                    <div class="card-value" id="productCount">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Mashinalar</div>
                    <div class="card-value" id="vehicleCount">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Ombor qoldig'i</div>
                    <div class="card-value" id="warehouseCount">...</div>
                </div>

            </div>

            <div class="panel">
                <h3>Supabase ulanishi</h3>

                <div id="connectionStatus" class="status">
                    Bazaga ulanmoqda...
                </div>
            </div>

        </div>

    </main>

</div>


<script>
/* ============================================
   SUPABASE SOZLAMALARI
   ============================================ */

const SUPABASE_URL =
    "https://megijiehhzynvddpeexk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_fTxkT_gPRuZzk1Drnv1pCg_K0Isf9wM";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentPage = "home";

/* ============================================
   YORDAMCHI FUNKSIYALAR
   ============================================ */

function byId(id) {
    return document.getElementById(id);
}

function safe(value) {
    return String(value ?? "—").replace(/[&<>"']/g, function (c) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c];
    });
}

function setText(id, value) {
    const element = byId(id);
    if (element) element.textContent = value;
}

function showError(message) {
    console.error(message);

    const content = byId("pageContent");

    if (content) {
        content.innerHTML = `
            <div class="panel">
                <h3>⚠️ Xatolik</h3>
                <p>${safe(message)}</p>
                <button onclick="reloadCurrentPage()">
                    Qayta yuklash
                </button>
            </div>
        `;
    }
}

async function fetchRows(table, columns, orderColumn) {
    const { data, error } = await supabaseClient
        .from(table)
        .select(columns)
        .order(orderColumn, { ascending: true })
        .limit(1000);

    if (error) throw error;

    return data || [];
}

/* ============================================
   SUPABASE BAZASINI TEKSHIRISH
   ============================================ */

async function testConnection() {
    const status = byId("connectionStatus");

    try {
        const { error } = await supabaseClient
            .from("products")
            .select("id")
            .limit(1);

        if (error) throw error;

        if (status) {
            status.textContent = "✅ Supabase muvaffaqiyatli ulandi";
            status.classList.remove("error");
        }

        await loadDashboard();

    } catch (error) {
        console.error("Supabase xatosi:", error);

        if (status) {
            status.textContent =
                "❌ Supabase ulanishida xato: " + error.message;
            status.classList.add("error");
        }
    }
}

/* ============================================
   BOSH SAHIFA / DASHBOARD
   ============================================ */

async function getCount(table) {
    const { count, error } = await supabaseClient
        .from(table)
        .select("id", { count: "exact", head: true });

    if (error) throw error;

    return count ?? 0;
}

async function loadDashboard() {
    try {
        const [customers, products, vehicles, warehouse] =
            await Promise.all([
                getCount("customers"),
                getCount("products"),
                getCount("vehicles"),
                supabaseClient
                    .from("warehouse_stock")
                    .select("available_racks")
            ]);

        if (warehouse.error) throw warehouse.error;

        const totalRacks = (warehouse.data || []).reduce(
            (sum, row) => sum + Number(row.available_racks || 0),
            0
        );

        setText("customerCount", customers);
        setText("productCount", products);
        setText("vehicleCount", vehicles);
        setText("warehouseCount", totalRacks);

    } catch (error) {
        console.error("Dashboard xatosi:", error);
    }
}

/* ============================================
   SAHIFA SARLAVHASI
   ============================================ */

function setPageHeading(title, description) {
    setText("pageTitle", title);
    setText("pageDescription", description);
}

/* ============================================
   JADVAL CHIZISH VA QIDIRUV
   ============================================ */

function renderTable(title, columns, rows, searchableFields) {
    const content = byId("pageContent");
    if (!content) return;

    window.bnbmRows = rows;
    window.bnbmColumns = columns;
    window.bnbmSearchFields = searchableFields || columns.map(c => c.key);

    content.innerHTML = `
        <div class="panel">
            <h3>${safe(title)}</h3>

            <input
                id="bnbmSearch"
                type="search"
                placeholder="Ma'lumotlarni qidirish..."
                style="width:100%;max-width:450px;padding:10px;
                       margin:10px 0 16px;box-sizing:border-box"
                oninput="filterCurrentTable()"
            >

            <p id="bnbmResultCount">
                Jami: ${rows.length} ta yozuv
            </p>

            <div style="overflow-x:auto">
                <table style="width:100%;border-collapse:collapse">
                    <thead>
                        <tr>
                            ${columns.map(col => `
                                <th style="padding:10px;text-align:left;
                                           border-bottom:2px solid #ddd">
                                    ${safe(col.label)}
                                </th>
                            `).join("")}
                        </tr>
                    </thead>
                    <tbody id="bnbmTableBody"></tbody>
                </table>
            </div>
        </div>
    `;

    drawTableRows(rows);
}

function drawTableRows(rows) {
    const tbody = byId("bnbmTableBody");
    if (!tbody) return;

    tbody.innerHTML = rows.map(row => `
        <tr>
            ${window.bnbmColumns.map(col => `
                <td style="padding:10px;border-bottom:1px solid #eee">
                    ${safe(row[col.key])}
                </td>
            `).join("")}
        </tr>
    `).join("");

    const counter = byId("bnbmResultCount");

    if (counter) {
        counter.textContent = `Ko‘rsatilmoqda: ${rows.length} ta yozuv`;
    }
}

function filterCurrentTable() {
    const input = byId("bnbmSearch");
    if (!input) return;

    const query = input.value.trim().toLowerCase();

    const filtered = (window.bnbmRows || []).filter(row =>
        (window.bnbmSearchFields || []).some(key =>
            String(row[key] ?? "").toLowerCase().includes(query)
        )
    );

    drawTableRows(filtered);
}

/* ============================================
   MAHSULOTLAR
   ============================================ */

async function loadProducts() {
    const rows = await fetchRows(
        "products",
        "id,name,pieces_per_rack,length_m,width_m,calculation_type,active",
        "name"
    );

    renderTable("📦 Mahsulotlar", [
        { key: "id", label: "ID" },
        { key: "name", label: "Mahsulot nomi" },
        { key: "pieces_per_rack", label: "Dona / ramka" },
        { key: "length_m", label: "Uzunlik (m)" },
        { key: "width_m", label: "En (m)" },
        { key: "calculation_type", label: "Hisob turi" },
        { key: "active", label: "Faol" }
    ], rows, ["name", "calculation_type"]);
}

/* ============================================
   BUYURTMACHILAR
   ============================================ */

async function loadCustomers() {
    const rows = await fetchRows(
        "customers",
        "id,name,phone,address,receiver,stir,active",
        "name"
    );

    renderTable("🏢 Buyurtmachilar", [
        { key: "id", label: "ID" },
        { key: "name", label: "Firma nomi" },
        { key: "phone", label: "Telefon" },
        { key: "address", label: "Manzil" },
        { key: "receiver", label: "Qabul qiluvchi" },
        { key: "stir", label: "STIR" },
        { key: "active", label: "Faol" }
    ], rows, ["name", "phone", "address", "receiver", "stir"]);
}

/* ============================================
   AVTOMOBILLAR
   ============================================ */

async function loadVehicles() {
    const rows = await fetchRows(
        "vehicles",
        "id,vehicle_number,driver_name,phone,active",
        "vehicle_number"
    );

    renderTable("🚛 Avtomobillar", [
        { key: "id", label: "ID" },
        { key: "vehicle_number", label: "Davlat raqami" },
        { key: "driver_name", label: "Haydovchi" },
        { key: "phone", label: "Telefon" },
        { key: "active", label: "Faol" }
    ], rows, ["vehicle_number", "driver_name", "phone"]);
}

/* ============================================
   OMBOR QOLDIQLARI
   ============================================ */

async function loadWarehouse() {
    const { data, error } = await supabaseClient
        .from("warehouse_stock")
        .select(`
            id,
            stock_date,
            zone,
            row_number,
            product_id,
            pieces_per_rack,
            available_racks,
            original_racks,
            scattered_racks,
            products(name)
        `)
        .order("stock_date", { ascending: false })
        .limit(1000);

    if (error) throw error;

    const rows = (data || []).map(item => ({
        ...item,
        product_name: item.products?.name || ("ID " + item.product_id)
    }));

    renderTable("🏭 Ombor qoldiqlari", [
        { key: "stock_date", label: "Sana" },
        { key: "zone", label: "Zona" },
        { key: "row_number", label: "Qator" },
        { key: "product_name", label: "Mahsulot" },
        { key: "pieces_per_rack", label: "Dona / ramka" },
        { key: "original_racks", label: "Boshlang‘ich ramka" },
        { key: "scattered_racks", label: "Sochilgan ramka" },
        { key: "available_racks", label: "Qolgan ramka" }
    ], rows, ["stock_date", "zone", "product_name"]);
}

/* ============================================
   NAKLADNOYLAR RO‘YXATI
   ============================================ */

async function loadShipments() {
    const { data, error } = await supabaseClient
        .from("shipments")
        .select(`
            id,
            shipment_number,
            requirements,
            created_at,
            customers(name),
            vehicles(vehicle_number,driver_name)
        `)
        .order("created_at", { ascending: false })
        .limit(1000);

    if (error) throw error;

    const rows = (data || []).map(item => ({
        ...item,
        customer_name: item.customers?.name || "—",
        vehicle_info: item.vehicles
            ? `${item.vehicles.vehicle_number} ${item.vehicles.driver_name || ""}`
            : "—"
    }));

    renderTable("🧾 Nakladnoylar", [
        { key: "shipment_number", label: "Nakladnoy raqami" },
        { key: "customer_name", label: "Buyurtmachi" },
        { key: "vehicle_info", label: "Avtomobil / haydovchi" },
        { key: "requirements", label: "Talablar" },
        { key: "created_at", label: "Yaratilgan vaqt" }
    ], rows, ["shipment_number", "customer_name", "vehicle_info"]);
}

/* ============================================
   YUKLASH TARIXI
   ============================================ */

async function loadHistory() {
    const { data, error } = await supabaseClient
        .from("shipment_allocations_log")
        .select(`
            id,
            shipment_id,
            shipment_item_id,
            warehouse_stock_id,
            zone,
            allocated_racks,
            pieces_per_rack,
            created_at
        `)
        .order("created_at", { ascending: false })
        .limit(1000);

    if (error) throw error;

    renderTable("📚 Yuklash tarixi", [
        { key: "created_at", label: "Sana / vaqt" },
        { key: "shipment_id", label: "Nakladnoy ID" },
        { key: "shipment_item_id", label: "Mahsulot ID" },
        { key: "warehouse_stock_id", label: "Ombor yozuvi ID" },
        { key: "zone", label: "Zona" },
        { key: "allocated_racks", label: "Yuklangan ramka" },
        { key: "pieces_per_rack", label: "Dona / ramka" }
    ], data || [], ["shipment_id", "zone"]);
}

/* ============================================
   SAHIFALAR O‘RTASIDA O‘TISH
   ============================================ */

async function showPage(page, button) {
    currentPage = page;

    document.querySelectorAll(".menu").forEach(btn => {
        btn.classList.remove("active");
    });

    if (button) button.classList.add("active");

    try {
        switch (page) {
            case "home":
                setPageHeading(
                    "Bosh sahifa",
                    "BNBM nakladnoy boshqaruv tizimi"
                );

                const content = byId("pageContent");
                if (content) {
                    content.innerHTML = `
                        <div class="panel">
                            <h3>🏠 Bosh sahifa</h3>
                            <p>Ma'lumotlar Supabase bazasidan olinadi.</p>
                        </div>
                    `;
                }

                await loadDashboard();
                break;

            case "products":
                setPageHeading("Mahsulotlar", "BNBM mahsulotlari");
                await loadProducts();
                break;

            case "customers":
                setPageHeading("Buyurtmachilar", "Buyurtmachilar bazasi");
                await loadCustomers();
                break;

            case "vehicles":
                setPageHeading("Mashinalar", "Transport vositalari");
                await loadVehicles();
                break;

            case "warehouse":
                setPageHeading("Bugungi ombor", "Ombor qoldiqlari");
                await loadWarehouse();
                break;

            case "shipments":
                setPageHeading("Nakladnoylar", "Yuk xatlari ro‘yxati");
                await loadShipments();
                break;

            case "history":
                setPageHeading("Nakladnoy tarixi", "Yuklash operatsiyalari");
                await loadHistory();
                break;

            default:
                showError("Noma'lum sahifa: " + page);
        }
    } catch (error) {
        showError(error.message || "Ma'lumotlarni yuklashda xatolik.");
    }
}

function reloadCurrentPage() {
    showPage(currentPage);
}

/* ============================================
   START
   ============================================ */

document.addEventListener("DOMContentLoaded", function () {
    testConnection();
});

</script>

</body>
</html>
