
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNBM NAKLADNOY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial,sans-serif;background:#f3f6fa;color:#172033}
header{background:white;padding:18px 25px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
header h1{margin:0;font-size:22px}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:220px;background:white;padding:15px}
.menu{display:block;width:100%;text-align:left;padding:13px;margin-bottom:5px;border:0;border-radius:7px;background:white;cursor:pointer}
.menu.active,.menu:hover{background:#e8f1ff}
.content{padding:24px;flex:1;min-width:0}
.panel{background:white;border:1px solid #e1e5eb;border-radius:10px;padding:20px;margin-bottom:18px}
h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid #ccd3dd;border-radius:5px;font:14px Arial}
.field textarea{resize:vertical}
.full{grid-column:1/-1}
button.action{padding:10px 15px;border:0;border-radius:6px;background:#155eef;color:white;cursor:pointer;margin:4px 4px 4px 0}
button.secondary{background:#475467}
button.danger{background:#b42318}
.table-wrap{overflow-x:auto}
#itemsInput{width:100%;border-collapse:collapse;margin:12px 0}
#itemsInput th,#itemsInput td{border:1px solid #ccd3dd;padding:5px}
#itemsInput th{background:#f0f3f7;font-size:12px}
#itemsInput input{width:100%;min-width:75px;padding:7px;border:1px solid #ddd}
#itemsInput .product-name{min-width:180px}
.help{color:#667085;font-size:12px}
#connectionStatus{margin-top:10px;color:#667085}
.shipment-list{padding:10px 0;border-bottom:1px solid #ddd}
.shipment-list button{float:right}
#historyList{margin-top:15px}

/* Chop etiladigan nakladnoy */
#printDocument{display:none}
@page{size:A5 landscape;margin:5mm}
@media print{
  body{background:white!important;margin:0!important}
  body *{visibility:hidden!important}
  #printDocument,#printDocument *{visibility:visible!important}
  #printDocument{
    display:block!important;
    position:absolute!important;
    left:0!important;top:0!important;
    width:200mm!important;
    color:#000!important;
    font-family:Arial,sans-serif!important;
    font-size:8pt!important;
  }
  .print-title{text-align:center;font-size:12pt;font-weight:bold;margin:0 0 3mm}
  .print-top{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:2mm}
  .print-top td{border:1px solid #000;padding:2mm;vertical-align:top;overflow-wrap:anywhere}
  .print-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .print-table th,.print-table td{border:1px solid #000;padding:1.5mm 1mm;text-align:center;overflow-wrap:anywhere}
  .print-table th{font-size:7pt}
  .print-table .left{text-align:left}
  .print-note{border:1px solid #000;padding:2mm;margin-top:2mm;font-weight:bold}
  .print-signatures{width:100%;border-collapse:collapse;margin-top:3mm}
  .print-signatures td{width:33.33%;height:13mm;vertical-align:top;padding:2mm;border:1px solid #000}
  .print-small{font-size:7pt}
  .no-print{display:none!important}
}
@media(max-width:800px){
 .layout{display:block}
 .sidebar{width:100%}
 .content{padding:12px}
 .form-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
  <h1>BNBM NAKLADNOY</h1>
  <span>Yuk xatlarini boshqarish tizimi</span>
</header>

<div class="layout">
<aside class="sidebar no-print">
  <button class="menu active" onclick="showPage('home',this)">🏠 Bosh sahifa</button>
  <button class="menu" onclick="showPage('shipments',this)">🧾 Yangi nakladnoy</button>
  <button class="menu" onclick="showPage('warehouse',this)">🏭 Bugungi ombor</button>
  <button class="menu" onclick="showPage('customers',this)">🏢 Buyurtmachilar</button>
  <button class="menu" onclick="showPage('products',this)">📦 Mahsulotlar</button>
  <button class="menu" onclick="showPage('vehicles',this)">🚛 Mashinalar</button>
  <button class="menu" onclick="showPage('history',this)">📚 Nakladnoy tarixi</button>
</aside>

<main class="content no-print">
  <h2 id="pageTitle">Bosh sahifa</h2>
  <p id="pageDescription">BNBM nakladnoy boshqaruv tizimi</p>
  <div id="pageContent"></div>
  <div id="connectionStatus"></div>
</main>
</div>

<!-- Chop etish oynasi -->
<div id="printDocument"></div>

<script>
const SUPABASE_URL="https://megijiehhzynvddpeexk.supabase.co";
const SUPABASE_KEY="sb_publishable_fTxkT_gPRuZzk1Drnv1pCg_K0Isf9wM";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let itemCounter=0;

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function val(id){return document.getElementById(id)?.value?.trim()||""}
function today(){
  const d=new Date();
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
}
function newItem(name="",order="",racks="",sqm="",note=""){
  itemCounter++;
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td class="row-number">${itemCounter}</td>
    <td><input class="order" value="${esc(order)}" placeholder="BNBM-00001"></td>
    <td><input class="product-name" value="${esc(name)}" placeholder="Mahsulot nomi / razmeri"></td>
    <td><input class="racks" type="number" min="0" step="any" value="${esc(racks)}" placeholder="0"></td>
    <td><input class="sqm" type="number" min="0" step="any" value="${esc(sqm)}" placeholder="0"></td>
    <td><input class="note" value="${esc(note)}" placeholder="Masalan: 72/шт B38/A18"></td>
    <td><button type="button" class="action danger" onclick="removeItem(this)">×</button></td>`;
  document.getElementById("itemsBody").appendChild(tr);
  renumber();
}
function removeItem(button){
  button.closest("tr").remove();
  renumber();
}
function renumber(){
  document.querySelectorAll("#itemsBody tr").forEach((tr,i)=>{
    tr.querySelector(".row-number").textContent=i+1;
  });
}
function getItems(){
  return [...document.querySelectorAll("#itemsBody tr")].map(tr=>({
    order:tr.querySelector(".order").value.trim(),
    name:tr.querySelector(".product-name").value.trim(),
    racks:tr.querySelector(".racks").value,
    sqm:tr.querySelector(".sqm").value,
    note:tr.querySelector(".note").value.trim()
  })).filter(x=>x.name||x.order||x.racks||x.sqm||x.note);
}

function showPage(page,button){
  document.querySelectorAll(".menu").forEach(b=>b.classList.remove("active"));
  if(button)button.classList.add("active");
  const title=document.getElementById("pageTitle");
  const desc=document.getElementById("pageDescription");
  const content=document.getElementById("pageContent");

  if(page==="home"){
    title.textContent="Bosh sahifa";
    desc.textContent="BNBM nakladnoy boshqaruv tizimi";
    content.innerHTML=`
      <div class="panel">
        <h3>Yuk xati</h3>
        <p>Nakladnoyni yaratish uchun “Yangi nakladnoy” bo‘limini oching.</p>
        <button class="action" onclick="showPage('shipments',document.querySelectorAll('.menu')[1])">+ Yangi nakladnoy</button>
      </div>`;
  }else if(page==="shipments"){
    title.textContent="Yangi nakladnoy";
    desc.textContent="Ma’lumotlarni kiriting, keyin A5 gorizontal formatda chop eting.";
    content.innerHTML=`
      <div class="panel">
        <h3>1. Buyurtma ma’lumotlari</h3>
        <div class="form-grid">
          <div class="field"><label>Sana</label><input id="docDate" value="${today()}"></div>
          <div class="field"><label>Buyurtma birligi / firma</label><input id="customer" placeholder="Masalan: MBS BNBM GUPSUM"></div>
          <div class="field"><label>Yuk yuborish joyi</label><input id="shipFrom" placeholder="Masalan: Sadoxon"></div>
          <div class="field"><label>STIR / telefon</label><input id="recipientPhone" placeholder="Telefon yoki STIR"></div>
          <div class="field"><label>Yuborish manzili</label><input id="address" placeholder="Manzil va qabul qiluvchi"></div>
          <div class="field"><label>Avtomobil raqami</label><input id="vehicle" placeholder="01012QGA"></div>
          <div class="field"><label>Haydovchi F.I.Sh.</label><input id="driver" placeholder="Haydovchi ismi"></div>
          <div class="field"><label>Haydovchi telefoni</label><input id="driverPhone" placeholder="Telefon raqami"></div>
          <div class="field"><label>Buyurtma talablari</label><input id="requirements" value="ИИБ ходимлари назоратидан утиши шарт !"></div>
          <div class="field full"><label>Qo‘shimcha ko‘rsatma</label><input id="extraInstruction" value="请过磅 / Tarozidan o'tkazing"></div>
        </div>
      </div>
      <div class="panel">
        <h3>2. Mahsulotlar</h3>
        <p class="help">Har bir mahsulot uchun nomi, ramka soni, kvadrat metr va eslatmani kiriting.</p>
        <div class="table-wrap">
          <table id="itemsInput">
            <thead><tr><th>N/r</th><th>Buyurtma raqami</th><th>Element nomi / razmeri</th><th>Ramka</th><th>m²</th><th>Eslatma</th><th></th></tr></thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
        <button class="action secondary" onclick="newItem()">+ Mahsulot qo‘shish</button>
      </div>
      <div class="panel">
        <h3>3. Imzo va yuklash ko‘rsatmasi</h3>
        <div class="field">
          <label>Pastki ogohlantirish</label>
          <textarea id="loadingWarning" rows="2">YUKLASH UCHUN MAXSUS GIPSKARTON BO'LAKLARIDAN FOYDALANING VA YUKLANGAN MAHSULOTLARGA ARQON(REMEN)NI TORTING ! ! !</textarea>
        </div>
        <p class="help">Chop etishda A5 gorizontal — 210 × 148 mm format tanlanadi.</p>
        <button class="action" onclick="printShipment()">🖨️ Nakladnoyni chop etish / PDF</button>
        <button class="action secondary" onclick="saveDraft()">💾 Qoralamani saqlash</button>
        <button class="action secondary" onclick="loadDraft()">Qoralamani ochish</button>
        <button class="action danger" onclick="clearForm()">Tozalash</button>
        <div id="formMessage" class="help"></div>
      </div>`;
    newItem("FOREVER2500*1200*9.0","BNBM-07986","3","648","72/шт B38/A18");
    newItem("FOREVER2500*1200*12.0","BNBM-07986","3","522","58/шт C36/37");
  }else if(page==="history"){
    title.textContent="Nakladnoy tarixi";
    desc.textContent="Ushbu brauzerda saqlangan qoralamalar";
    content.innerHTML=`<div class="panel"><h3>Saqlangan qoralamalar</h3><div id="historyList"></div></div>`;
    renderHistory();
  }else{
    const names={warehouse:"Bugungi ombor",customers:"Buyurtmachilar",products:"Mahsulotlar",vehicles:"Mashinalar"};
    title.textContent=names[page]||"Bo‘lim";
    desc.textContent="Ushbu bo‘lim keyingi bosqichda ulanadi.";
    content.innerHTML=`<div class="panel"><h3>${esc(names[page]||"Bo‘lim")}</h3><p>Bu bo‘limning funksiyalari hali ulanmagan.</p></div>`;
  }
}

function formData(){
  return {
    date:val("docDate"),customer:val("customer"),shipFrom:val("shipFrom"),
    recipientPhone:val("recipientPhone"),address:val("address"),
    vehicle:val("vehicle"),driver:val("driver"),driverPhone:val("driverPhone"),
    requirements:val("requirements"),extraInstruction:val("extraInstruction"),
    warning:val("loadingWarning"),items:getItems()
  };
}
function saveDraft(){
  const data=formData();
  const all=JSON.parse(localStorage.getItem("bnbmDrafts")||"[]");
  data.id=Date.now();
  data.savedAt=new Date().toLocaleString();
  all.unshift(data);
  localStorage.setItem("bnbmDrafts",JSON.stringify(all.slice(0,100)));
  document.getElementById("formMessage").textContent="Qoralama ushbu brauzerda saqlandi.";
}
function loadDraft(id){
  const all=JSON.parse(localStorage.getItem("bnbmDrafts")||"[]");
  const data=id?all.find(x=>x.id===id):all[0];
  if(!data){alert("Saqlangan qoralama topilmadi.");return;}
  if(!document.getElementById("docDate")){
    showPage("shipments",document.querySelectorAll(".menu")[1]);
  }
  const map={docDate:"date",customer:"customer",shipFrom:"shipFrom",
    recipientPhone:"recipientPhone",address:"address",vehicle:"vehicle",
    driver:"driver",driverPhone:"driverPhone",requirements:"requirements",
    extraInstruction:"extraInstruction",loadingWarning:"warning"};
  Object.entries(map).forEach(([el,key])=>{
    const node=document.getElementById(el);
    if(node)node.value=data[key]||"";
  });
  document.getElementById("itemsBody").innerHTML="";
  itemCounter=0;
  (data.items||[]).forEach(x=>newItem(x.name,x.order,x.racks,x.sqm,x.note));
  if(!data.items?.length)newItem();
  document.getElementById("formMessage").textContent="Qoralama ochildi.";
}
function clearForm(){
  if(!confirm("Formadagi ma’lumotlarni tozalaysizmi?"))return;
  ["customer","shipFrom","recipientPhone","address","vehicle","driver","driverPhone","extraInstruction"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("itemsBody").innerHTML="";
  itemCounter=0;newItem();
}
function renderHistory(){
  const target=document.getElementById("historyList");
  if(!target)return;
  const all=JSON.parse(localStorage.getItem("bnbmDrafts")||"[]");
  if(!all.length){target.innerHTML="<p>Hali qoralama saqlanmagan.</p>";return;}
  target.innerHTML=all.map(x=>`
    <div class="shipment-list">
      <strong>${esc(x.customer||"Firma kiritilmagan")}</strong>
      — ${esc(x.date||"Sana yo‘q")} · ${esc(x.savedAt||"")}
      <button class="action" onclick="loadDraft(${Number(x.id)})">Ochish</button>
    </div>`).join("");
}

function printShipment(){
  const d=formData();
  if(!d.customer){alert("Buyurtma birligi / firma nomini kiriting.");return;}
  if(!d.items.length){alert("Kamida bitta mahsulot kiriting.");return;}

  const rows=d.items.map((x,i)=>`
    <tr>
      <td>${i+1}</td><td>${esc(x.order)}</td>
      <td class="left">${esc(x.name)}</td><td>${esc(x.racks)}</td>
      <td>${esc(x.sqm)}</td><td>${esc(x.note)}</td>
    </tr>`).join("");

  document.getElementById("printDocument").innerHTML=`
    <div class="print-title">BNBM — YUK XATI / NAKLADNOY</div>
    <table class="print-top">
      <tr>
        <td style="width:50%"><b>${esc(d.date)}</b><br>订货单位 / Buyurtma birligi:<br><b>${esc(d.customer)}</b></td>
        <td style="width:25%">发货地 / Yuk yuborish joyi:<br><b>${esc(d.shipFrom)}</b></td>
        <td style="width:25%">电话 / Telefon:<br><b>${esc(d.recipientPhone)}</b></td>
      </tr>
      <tr>
        <td>收货地址、收货人、电话 / Yuborish manzili, qabul qiluvchi:<br>${esc(d.address)}</td>
        <td colspan="2">车辆信息 / Avtomobil haqida ma'lumot:<br><b>${esc(d.vehicle)}</b><br>Haydovchi: ${esc(d.driver)}<br>Tel: ${esc(d.driverPhone)}</td>
      </tr>
      <tr>
        <td colspan="2">订单要求 / Buyurtma talablari:<br>${esc(d.requirements)}</td>
        <td>${esc(d.extraInstruction)}</td>
      </tr>
    </table>
    <table class="print-table">
      <thead><tr>
        <th style="width:6%">序号<br>N/r</th>
        <th style="width:16%">订单号<br>Buyurtma raqami</th>
        <th style="width:29%">货物名称<br>Element nomi / razmeri</th>
        <th style="width:14%">装车数量(架)<br>Ramka</th>
        <th style="width:17%">装车数量(平米)<br>Yuk miqdori (m²)</th>
        <th style="width:18%">备注<br>Eslatma</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="print-small" style="margin-top:2mm">
      所装货物外观完好，整车无破损，装车数量准确无误；<br>
      Yuklangan tovarlarning tashqi ko‘rinishi buzilmagani, mashina zarar ko‘rmagani va yuklangan miqdor to‘g‘riligini tasdiqlayman.
    </div>
    <table class="print-signatures">
      <tr>
        <td>驾驶员签字 / Haydovchi imzosi:<br><br>________________</td>
        <td>收货人签字 / Qabul qiluvchi imzosi:<br><br>________________</td>
        <td>发货人签字 / Yuboruvchi imzosi:<br><br>________________</td>
      </tr>
    </table>
    <div class="print-note">${esc(d.warning)}</div>`;

  window.print();
}

async function testConnection(){
  const status=document.getElementById("connectionStatus");
  try{
    const {error}=await db.from("products").select("id").limit(1);
    if(error)throw error;
    status.textContent="✅ Supabase bazasiga ulanish muvaffaqiyatli.";
  }catch(e){
    console.error(e);
    status.textContent="Supabase tekshiruvi: "+e.message;
  }
}

showPage("home",document.querySelector(".menu"));
testConnection();
</script>
</body>
</html>
