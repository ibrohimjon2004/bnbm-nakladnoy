 
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNBM NAKLADNOY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#fff;padding:20px 28px;border-bottom:1px solid #ddd}
header h1{margin:0;color:#174a83}
.layout{display:flex;min-height:calc(100vh - 75px)}
nav{width:230px;background:white;padding:15px}
nav button{width:100%;padding:13px;margin-bottom:7px;border:0;border-radius:8px;text-align:left;background:#f4f6fa;cursor:pointer;font-size:15px}
nav button:hover{background:#dceaff}
main{flex:1;padding:25px;min-width:0}
.panel,.card{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:22px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:14px}
label{display:block;font-weight:bold;margin:15px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:7px;font-size:15px}
textarea{min-height:80px}
.primary{background:#1769aa;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin-top:18px}
.note{color:#68758a;font-size:13px}
@media(max-width:700px){.layout{display:block}nav{width:100%}main{padding:14px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>BNBM NAKLADNOY</h1>
  Yuk xatlarini boshqarish tizimi
</header>

<div class="layout">
<nav>
  <button onclick="showPage('home')">🏠 Bosh sahifa</button>
  <button onclick="showPage('shipments')">🧾 Yangi nakladnoy</button>
  <button onclick="showPage('customers')">🏢 Buyurtmachilar</button>
  <button onclick="showPage('products')">📦 Mahsulotlar</button>
  <button onclick="showPage('vehicles')">🚛 Mashinalar</button>
  <button onclick="showPage('history')">📚 Nakladnoy tarixi</button>
</nav>

<main>
  <h2 id="pageTitle">Bosh sahifa</h2>
  <div id="pageContent">
    <div class="cards">
      <div class="card">Buyurtmachilar: <b id="customerCount">...</b></div>
      <div class="card">Mahsulotlar: <b id="productCount">...</b></div>
      <div class="card">Mashinalar: <b id="vehicleCount">...</b></div>
    </div>
    <div class="panel" id="status">Supabase bazasiga ulanmoqda...</div>
  </div>
</main>
</div>

<script>
const SUPABASE_URL = "https://megijiehhzynvddpeexk.supabase.co";
const SUPABASE_KEY = "sb_publishable_fTxkT_gPRuZzk1Drnv1pCg_K0Isf9wM";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let customersCache = [];

async function loadDashboard() {
  try {
    const [c,p,v] = await Promise.all([
      db.from("customers").select("*"),
      db.from("products").select("id", {count:"exact",head:true}),
      db.from("vehicles").select("id", {count:"exact",head:true})
    ]);

    if (c.error) throw c.error;
    if (p.error) throw p.error;
    if (v.error) throw v.error;

    customersCache = c.data || [];
    document.getElementById("customerCount").textContent = customersCache.length;
    document.getElementById("productCount").textContent = p.count ?? 0;
    document.getElementById("vehicleCount").textContent = v.count ?? 0;
    document.getElementById("status").textContent = "✅ Supabase bazasiga ulandi";
  } catch(e) {
    console.error(e);
    document.getElementById("status").textContent =
      "Bazani yuklashda xato: " + e.message;
  }
}

function getCustomerName(c) {
  const keys = [
    "name", "company_name", "customer_name",
    "firm_name", "company", "title", "legal_name"
  ];
  for (const key of keys) {
    if (typeof c[key] === "string" && c[key].trim()) return c[key].trim();
  }
  return "";
}

async function loadCustomerSuggestions() {
  const list = document.getElementById("customerSuggestions");
  if (!list) return;

  list.innerHTML = "";

  try {
    const {data,error} = await db.from("customers").select("*").limit(1000);
    if (error) throw error;

    customersCache = data || [];
    const names = [...new Set(customersCache.map(getCustomerName).filter(Boolean))];

    names.sort((a,b) => a.localeCompare(b));

    names.forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      list.appendChild(option);
    });

    document.getElementById("customerHelp").textContent =
      names.length
        ? "Bazadan " + names.length + " ta firma yuklandi. Firma nomini yozishni boshlang."
        : "Firmalar topilmadi. Jadvaldagi firma nomi ustunini tekshirish kerak.";
  } catch(e) {
    console.error("Firmalarni yuklash xatosi:",e);
    document.getElementById("customerHelp").textContent =
      "Firmalarni yuklab bo‘lmadi: " + e.message;
  }
}

function showPage(page) {
  const title = document.getElementById("pageTitle");
  const content = document.getElementById("pageContent");

  if (page === "home") {
    title.textContent = "Bosh sahifa";
    content.innerHTML = `
      <div class="cards">
        <div class="card">Buyurtmachilar: <b id="customerCount">${customersCache.length}</b></div>
        <div class="card">Mahsulotlar: <b id="productCount">...</b></div>
        <div class="card">Mashinalar: <b id="vehicleCount">...</b></div>
      </div>
      <div class="panel" id="status">Bosh sahifa</div>`;
    loadDashboard();
  }

  else if (page === "shipments") {
    title.textContent = "Yangi nakladnoy";
    content.innerHTML = `
      <div class="panel">
        <h3>🧾 Yuk xati ma’lumotlari</h3>
        <label>Sana</label>
        <input id="shipDate" type="date">

        <label>Buyurtmachi firma</label>
        <input id="customer" list="customerSuggestions"
          placeholder="Firma nomini yozing..." autocomplete="off">
        <datalist id="customerSuggestions"></datalist>
        <p class="note" id="customerHelp">Firmalar bazadan yuklanmoqda...</p>

        <label>Yuk yuborish joyi</label>
        <input id="dispatchPlace" placeholder="Masalan: Sadoxon">

        <label>Telefon / STIR</label>
        <input id="customerPhone" placeholder="Telefon yoki STIR">

        <label>Qabul qiluvchi manzili</label>
        <input id="address" placeholder="Manzil">

        <label>Avtomobil raqami</label>
        <input id="vehiclePlate" placeholder="Masalan: 01 A 123 BC">

        <label>Haydovchi F.I.Sh.</label>
        <input id="driverName" placeholder="Haydovchi ismi">

        <label>Haydovchi telefoni</label>
        <input id="driverPhone" placeholder="Telefon raqami">

        <label>Talablar va ko‘rsatmalar</label>
        <textarea id="instructions" placeholder="Masalan: ИИБ ходимлари назоратидан утиши шарт!"></textarea>

        <button class="primary" onclick="printShipment()">Nakladnoyni chop etish</button>
        <p class="note">Bu tugma ma’lumotlarni chop etish oynasiga chiqaradi. Bazaga nakladnoy saqlash alohida funksiyani talab qiladi.</p>
      </div>`;
    document.getElementById("shipDate").value =
      new Date().toLocaleDateString("en-CA");
    loadCustomerSuggestions();
  }

  else {
    const pages = {
      customers:["Buyurtmachilar","Firmalar Supabase customers jadvalidan olinadi."],
      products:["Mahsulotlar","Mahsulotlar ro‘yxati bo‘limi."],
      vehicles:["Mashinalar","Transport vositalari bo‘limi."],
      history:["Nakladnoy tarixi","Saqlangan nakladnoylar tarixi bo‘limi."]
    };
    title.textContent = pages[page][0];
    content.innerHTML = `<div class="panel"><p>${pages[page][1]}</p></div>`;
  }
}

function printShipment() {
  const fields = [
    ["Sana","shipDate"],
    ["Buyurtmachi firma","customer"],
    ["Yuk yuborish joyi","dispatchPlace"],
    ["Telefon / STIR","customerPhone"],
    ["Qabul qiluvchi manzili","address"],
    ["Avtomobil raqami","vehiclePlate"],
    ["Haydovchi","driverName"],
    ["Haydovchi telefoni","driverPhone"],
    ["Talablar va ko‘rsatmalar","instructions"]
  ];

  const rows = fields.map(([label,id]) => {
    const value = document.getElementById(id).value || "";
    return `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`;
  }).join("");

  const w = window.open("", "_blank");
  if (!w) {
    alert("Chop etish oynasi bloklandi. Brauzerda pop-up oynalarga ruxsat bering.");
    return;
  }

  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>BNBM Nakladnoy</title>
    <style>
    @page{size:A5 landscape;margin:8mm}
    body{font-family:Arial,sans-serif;font-size:12px}
    h2{text-align:center}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #333;padding:7px;text-align:left}
    th{width:30%}
    </style></head><body>
    <h2>BNBM — YUK XATI</h2>
    <table>${rows}</table>
    <p>Haydovchi imzosi: __________________</p>
    <p>Qabul qiluvchi imzosi: __________________</p>
    <p>Yuk yuboruvchi imzosi: __________________</p>
    <script>window.onload=()=>window.print();<\/script>
    </body></html>`);
  w.document.close();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

loadDashboard();
</script>
</body>
</html>
